<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1d1026" />
  <title>Alley Echo</title>
  <!-- test build: keep it out of search engines until release -->
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="data:," />
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: #1d1026; overflow: hidden;
      -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none;
      -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
      touch-action: none;
    }
    #game {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      box-sizing: border-box;
      background: radial-gradient(ellipse at 50% 40%, #3a1a3c 0%, #1d1026 70%);
    }
    canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; touch-action: none; }
  </style>
</head>
<body>
  <div id="game"></div>
  <script type="module" src="/src/loop/main.ts"></script>
</body>
</html>
