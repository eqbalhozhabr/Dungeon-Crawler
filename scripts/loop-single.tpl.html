<title>%TITLE%</title>
<style>
  /* Layout: one portrait canvas, centred and scaled in whole device pixels; the rest is a dim sunset glow. */
  :root { --ink: #1d1026; --glow: #3a1a3c; --text: #fbeed8; color-scheme: dark; }
  html, body { height: 100%; margin: 0; padding: 0; background: var(--ink); color: var(--text); overflow: hidden;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; touch-action: none; }
  #game { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; box-sizing: border-box;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    background: radial-gradient(ellipse at 50% 40%, var(--glow) 0%, var(--ink) 70%); }
  canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; touch-action: none; }
</style>
<div id="game"></div>
<script type="module">%JS%</script>
